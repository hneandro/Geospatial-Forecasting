description: Safe, slow convergence. For limited GPU or first experiments.
data:
  batch_size: 16
  val_split: 0.15
  test_split: 0.1
  shuffle_buffer: 5000
model:
  architecture: Option A
  hidden_channels:
  - 32
  - 64
  kernel_size: 3
  padding: same
  dropout_spatial: 0.2
  dropout_temporal: 0.1
  weight_decay: 0.0001
optimizer:
  name: Adam
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-07
  learning_rate: 0.0005
  warmup_steps: 500
training:
  loss: MSE
  grad_clip_norm: 1.0
  max_epochs: 100
  early_stopping_patience: 10
  early_stopping_min_delta: 1.0e-05
